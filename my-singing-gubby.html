<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MY SINGING GUBBY</title>

    <link rel="stylesheet" href="my-singing-gubby.css">
</head>

<body>

    <!-- TOP BAR -->

    <header class="topbar">

        <a href="index.html" class="back-button">
            ← BACK
        </a>

        <div class="game-title">
            MY SINGING GUBBY
        </div>

        <div class="coin-display">
            🪙 <span id="coinAmount">10</span>
        </div>

    </header>


    <!-- GAME -->

    <main>

        <!-- ISLAND -->

        <section class="island">

            <div class="island-title">
                YOUR ISLAND
            </div>

            <div id="slots" class="slots">

                <div class="slot" data-slot="0">
                    <span>+</span>
                </div>

                <div class="slot" data-slot="1">
                    <span>+</span>
                </div>

                <div class="slot" data-slot="2">
                    <span>+</span>
                </div>

                <div class="slot" data-slot="3">
                    <span>+</span>
                </div>

                <div class="slot" data-slot="4">
                    <span>+</span>
                </div>

                <div class="slot" data-slot="5">
                    <span>+</span>
                </div>

            </div>

            <div id="islandMessage" class="island-message">
                Open your inventory and select a Gubby.
            </div>

        </section>


        <!-- BUTTONS -->

        <div class="bottom-buttons">

            <button id="shopButton">
                🛒 SHOP
            </button>

            <button id="inventoryButton">
                🎒 INVENTORY
            </button>

        </div>

    </main>


    <!-- SHOP -->

    <div id="shopPanel" class="panel">

        <div class="panel-header">

            <span>GUBBY SHOP</span>

            <button class="close-button" data-panel="shopPanel">
                ✕
            </button>

        </div>


        <div class="shop-item">

            <img src="gubby.png">

            <div class="item-info">

                <strong>Normal Gubby</strong>

                <small>🎵 Makes a silly sound</small>

                <span>🪙 5</span>

                <button onclick="buyGubby('normal')">
                    BUY
                </button>

            </div>

        </div>


        <div class="shop-item">

            <img
                src="gubby.png"
                class="golden"
            >

            <div class="item-info">

                <strong>Golden Gubby</strong>

                <small>✨ A shiny singer</small>

                <span>🪙 15</span>

                <button onclick="buyGubby('golden')">
                    BUY
                </button>

            </div>

        </div>

    </div>


    <!-- INVENTORY -->

    <div id="inventoryPanel" class="panel">

        <div class="panel-header">

            <span>GUBBY INVENTORY</span>

            <button class="close-button" data-panel="inventoryPanel">
                ✕
            </button>

        </div>


        <div id="inventory" class="inventory">

        </div>


        <div id="inventoryMessage" class="inventory-message">
            Choose a Gubby.
        </div>

    </div>


    <!-- SOUNDS -->

    <audio id="normalSound" src="gubby-sing.mp3"></audio>

    <audio id="goldenSound" src="golden-gubby-sing.mp3"></audio>


    <script src="my-singing-gubby.js"></script>

</body>

</html>
