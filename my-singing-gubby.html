<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MY SINGING GUBBY</title>

    <link rel="stylesheet" href="my-singing-gubby.css">
</head>

<body>

    <!-- TOP BAR -->

    <div class="topbar">

        <a href="index.html" class="back">
            ← BACK
        </a>

        <div class="title">
            MY SINGING GUBBY
        </div>

        <div class="coin-display">
            🪙 <span id="coins">10</span>
        </div>

    </div>


    <!-- ISLAND -->

    <main>

        <section class="island">

            <div class="island-title">
                YOUR ISLAND
            </div>

            <div id="gubbySlots">

                <div class="gubby-slot" data-slot="0"></div>
                <div class="gubby-slot" data-slot="1"></div>
                <div class="gubby-slot" data-slot="2"></div>
                <div class="gubby-slot" data-slot="3"></div>
                <div class="gubby-slot" data-slot="4"></div>
                <div class="gubby-slot" data-slot="5"></div>

            </div>

            <div class="island-help">
                Select a Gubby from your inventory, then choose a slot.
            </div>

        </section>


        <!-- BOTTOM CONTROLS -->

        <div class="controls">

            <button id="shopButton">
                🛒 SHOP
            </button>

            <button id="inventoryButton">
                🎒 INVENTORY
            </button>

        </div>

    </main>


    <!-- SHOP PANEL -->

    <div id="shopPanel" class="panel">

        <div class="panel-header">

            <span>GUBBY SHOP</span>

            <button class="close-panel" data-close="shopPanel">
                ✕
            </button>

        </div>

        <div class="shop-list">

            <div class="shop-card">

                <img src="gubby.png">

                <div class="shop-info">

                    <strong>Normal Gubby</strong>

                    <span>🪙 5</span>

                    <button onclick="buyGubby('normal')">
                        BUY
                    </button>

                </div>

            </div>


            <div class="shop-card">

                <img src="gubby.png" class="gold">

                <div class="shop-info">

                    <strong>Golden Gubby</strong>

                    <span>🪙 15</span>

                    <button onclick="buyGubby('golden')">
                        BUY
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- INVENTORY PANEL -->

    <div id="inventoryPanel" class="panel">

        <div class="panel-header">

            <span>GUBBY INVENTORY</span>

            <button class="close-panel" data-close="inventoryPanel">
                ✕
            </button>

        </div>

        <div id="inventoryList" class="inventory-list"></div>

        <div id="selectedText" class="selected-text">
            Select a Gubby to place it.
        </div>

    </div>


    <!-- SOUNDS -->

    <audio id="normalSound" src="gubby-sing.mp3"></audio>
    <audio id="goldenSound" src="golden-gubby-sing.mp3"></audio>


    <script src="my-singing-gubby.js"></script>

</body>
</html>
