<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GUBBY FULL CAOS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar">

        <div class="nav-logo">
            GUBBY
        </div>

        <div class="nav-links">

            <button id="gubbyButton">
                RELEASE GUBBYS
            </button>

            <button id="settingsButton">
                ⚙ SETTINGS
            </button>

            <button id="clearButton">
                🧹 CLEAR
            </button>

            <a href="still-life.html">
                <button>
                    ..?
                </button>
            </a>

            <a href="my-singing-gubby.html">
                <button>🎵 MY SINGING GUBBY</button>
            </a>

            <a
                href="https://isthatagubby.neocities.com/"
                target="_blank"
                rel="noopener noreferrer"
            >
                <button>
                    Go to Gubhub🤑
                </button>
            </a>

        </div>

    </nav>


    <!-- =========================
         TITLE
    ========================== -->

    <div class="title">
        GUBBY FULL CAOS
    </div>


    <!-- =========================
         SETTINGS
    ========================== -->

    <div id="settingsMenu" class="settings-menu">

        <div class="settings-header">

            <span>
                SETTINGS
            </span>

            <button id="closeSettings">
                ✕
            </button>

        </div>


        <div class="setting">

            <span>
                🔊 SOUNDS
            </span>

            <button
                class="toggle active"
                id="soundToggle"
            >
                ON
            </button>

        </div>


        <div class="setting">

            <span>
                🌎 GRAVITY
            </span>

            <button
                class="toggle active"
                id="gravityToggle"
            >
                ON
            </button>

        </div>


        <div class="setting">

            <span>
                💥 WALL BOUNCE
            </span>

            <button
                class="toggle active"
                id="bounceToggle"
            >
                ON
            </button>

        </div>


        <div class="setting">

            <span>
                👥 GUBBYS PER CLICK
            </span>

            <input
                id="gubbyAmount"
                type="number"
                min="1"
                max="100"
                value="15"
            >

        </div>


        <div class="setting">

            <span>
                ⚡ CHAOS MODE
            </span>

            <button
                class="toggle"
                id="chaosToggle"
            >
                OFF
            </button>

        </div>

    </div>


    <!-- =========================
         GUBBY CONTAINER
    ========================== -->

    <main id="gubbyContainer"></main>


    <!-- =========================
         AUDIO
    ========================== -->

    <audio id="gubbySound" src="gubby.mp3"></audio>


    <script src="script.js"></script>

</body>
</html>
