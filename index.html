<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GUBBY FULL CAOS</title>

    <!-- Website icon -->
    <link rel="icon" type="image/png" href="icon.png">

    <!-- Old Roblox Font -->
    <style>
        @font-face {
            font-family: "OldRoblox";
            src: url("OldRobloxFont-Regular.ttf") format("truetype");
        }
    </style>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =====================================
         TOP NAVBAR
    ====================================== -->

    <nav class="navbar">

        <!-- Logo -->
        <div class="nav-logo">
            GUBBY
        </div>


        <!-- Buttons -->
        <div class="nav-links">

            <button id="gubbyButton">
                RELEASE GUBBYS
            </button>


            <button id="settingsButton">
                ⚙ SETTINGS
            </button>


            <button id="clearButton">
                🧹 CLEAR
            </button>


            <a
                href="https://isthatagubby.neocities.com/"
                target="_blank"
            >
                <button>
                    Go to Gubhub🤑
                </button>
            </a>

        </div>

    </nav>



    <!-- =====================================
         TITLE
    ====================================== -->

    <div class="text-container">

        <span class="wavy-text">
            GUBBY FULL CAOS
        </span>

    </div>



    <!-- =====================================
         SETTINGS
    ====================================== -->

    <div id="settingsMenu">


        <div class="settingsHeader">

            <span>
                SETTINGS
            </span>

            <button id="closeSettings">
                ✕
            </button>

        </div>



        <div class="setting">

            <span>
                🔊 Sounds
            </span>

            <button
                class="toggle active"
                id="soundToggle"
            >
                ON
            </button>

        </div>



        <div class="setting">

            <span>
                🌎 Gravity
            </span>

            <button
                class="toggle active"
                id="gravityToggle"
            >
                ON
            </button>

        </div>



        <div class="setting">

            <span>
                💥 Wall Bounce
            </span>

            <button
                class="toggle active"
                id="bounceToggle"
            >
                ON
            </button>

        </div>



        <div class="setting">

            <span>
                👥 Gubbys per click
            </span>

            <input
                id="gubbyAmount"
                type="number"
                min="1"
                max="100"
                value="15"
            >

        </div>



        <div class="setting">

            <span>
                ⚡ Chaos Mode
            </span>

            <button
                class="toggle"
                id="chaosToggle"
            >
                OFF
            </button>

        </div>

    </div>



    <!-- =====================================
         GUBBY CONTAINER
    ====================================== -->

    <div id="gubbyContainer"></div>



    <!-- =====================================
         WALL SOUND
    ====================================== -->

    <audio
        id="gubbySound"
        src="gubby.mp3"
    ></audio>



    <!-- =====================================
         YOUTUBE MUSIC
    ====================================== -->

    <iframe
        id="youtubePlayer"
        src="https://www.youtube.com/embed/b12dBv7EDjU?autoplay=1&loop=1&playlist=b12dBv7EDjU"
        allow="autoplay; encrypted-media"
        frameborder="0"
    ></iframe>



    <script src="script.js"></script>

</body>

</html>
