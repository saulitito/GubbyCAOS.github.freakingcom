<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GUBBY FULL CAOS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================
         NAVBAR
    ====================================== -->

    <nav class="navbar">

        <div class="nav-logo">
            GUBBY.CAOS
        </div>

        <div class="nav-links">

            <button id="settingsButton">
                ⚙ SETTINGS
            </button>

            <button id="clearButton">
                🧹 CLEAR
            </button>

            <button id="gubhubButton">
                🏠 GUBHUB
            </button>

            <button id="stillLifeButton">
                ..?
            </button>

        </div>

    </nav>


    <!-- =====================================
         SETTINGS
    ====================================== -->

    <div
        id="settingsMenu"
        class="settings-menu"
    >

        <div class="settings-header">

            <span>
                GUBBY SETTINGS
            </span>

            <button id="closeSettings">
                ✕
            </button>

        </div>


        <div class="setting">

            <span>
                ✨ Golden Gubbys
            </span>

            <button
                id="goldenToggle"
                class="toggle active"
            >
                ON
            </button>

        </div>


        <div class="setting">

            <span>
                🌈 Rainbow Gubbys
            </span>

            <button
                id="rainbowToggle"
                class="toggle active"
            >
                ON
            </button>

        </div>


        <div class="setting">

            <span>
                💀 Starting Gubbys
            </span>

            <input
                id="gubbyAmount"
                type="number"
                min="1"
                max="100"
                value="25"
            >

        </div>

    </div>


    <!-- =====================================
         TITLE
    ====================================== -->

    <h1 class="title">
        GUBBY FULL CAOS
    </h1>


    <!-- =====================================
         GUBBY CONTAINER
    ====================================== -->

    <div id="gubbyContainer"></div>


    <!-- =====================================
         COMMENTS
    ====================================== -->

    <section class="comments-section">

        <h2 class="comments-title">
            GUBBY COMMENTS
        </h2>


        <div class="comment-form">

            <input
                id="commentName"
                type="text"
                maxlength="30"
                placeholder="Your Gubby name..."
                autocomplete="off"
            >


            <textarea
                id="commentText"
                maxlength="300"
                placeholder="Say something to the Gubby universe..."
            ></textarea>


            <button id="postComment">
                💬 POST COMMENT
            </button>

        </div>


        <div
            id="commentsList"
            class="comments-list"
        >
            <!-- Comments appear here -->
        </div>

    </section>


    <!-- =====================================
         MAIN SCRIPT
    ====================================== -->

    <script src="script.js"></script>


    <!-- =====================================
         FIREBASE COMMENTS
    ====================================== -->

    <script type="module">

        import {
            initializeApp
        }
        from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


        import {
            getFirestore,
            collection,
            addDoc,
            query,
            orderBy,
            onSnapshot,
            serverTimestamp
        }
        from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


        // =====================================
        // FIREBASE CONFIG
        // =====================================

        const firebaseConfig = {

            apiKey:
                "YOUR_API_KEY",

            authDomain:
                "YOUR_PROJECT.firebaseapp.com",

            projectId:
                "YOUR_PROJECT_ID",

            storageBucket:
                "YOUR_PROJECT.firebasestorage.app",

            messagingSenderId:
                "YOUR_MESSAGING_SENDER_ID",

            appId:
                "YOUR_APP_ID"

        };


        // =====================================
        // START FIREBASE
        // =====================================

        const app =
            initializeApp(
                firebaseConfig
            );


        const db =
            getFirestore(app);


        // =====================================
        // ELEMENTS
        // =====================================

        const nameInput =
            document.getElementById(
                "commentName"
            );


        const textInput =
            document.getElementById(
                "commentText"
            );


        const postButton =
            document.getElementById(
                "postComment"
            );


        const commentsList =
            document.getElementById(
                "commentsList"
            );


        // =====================================
        // POST COMMENT
        // =====================================

        postButton.addEventListener(
            "click",
            async () => {

                const name =
                    nameInput.value.trim();


                const text =
                    textInput.value.trim();


                if (!name || !text) {

                    alert(
                        "Your Gubby needs a name AND a comment! 😭"
                    );

                    return;
                }


                if (name.length > 30) {

                    alert(
                        "Gubby name is too long!"
                    );

                    return;
                }


                if (text.length > 300) {

                    alert(
                        "Comment is too long!"
                    );

                    return;
                }


                postButton.disabled = true;

                postButton.textContent =
                    "POSTING...";


                try {

                    await addDoc(
                        collection(
                            db,
                            "comments"
                        ),
                        {

                            name: name,

                            text: text,

                            createdAt:
                                serverTimestamp()

                        }
                    );


                    nameInput.value = "";

                    textInput.value = "";


                }
                catch (error) {

                    console.error(
                        "Comment error:",
                        error
                    );


                    alert(
                        "Gubby tripped over the database 💀"
                    );

                }


                postButton.disabled = false;

                postButton.textContent =
                    "💬 POST COMMENT";

            }
        );


        // =====================================
        // LOAD COMMENTS LIVE
        // =====================================

        const commentsQuery =
            query(
                collection(
                    db,
                    "comments"
                ),
                orderBy(
                    "createdAt",
                    "desc"
                )
            );


        onSnapshot(
            commentsQuery,
            snapshot => {

                commentsList.innerHTML = "";


                snapshot.forEach(
                    doc => {

                        const data =
                            doc.data();


                        // Comment card
                        const comment =
                            document.createElement(
                                "div"
                            );

                        comment.className =
                            "comment";


                        // Username
                        const name =
                            document.createElement(
                                "strong"
                            );

                        name.textContent =
                            "🗣️ " +
                            (data.name || "Unknown Gubby");


                        // Comment text
                        const text =
                            document.createElement(
                                "p"
                            );

                        text.textContent =
                            data.text || "";


                        comment.appendChild(
                            name
                        );


                        comment.appendChild(
                            text
                        );


                        commentsList.appendChild(
                            comment
                        );

                    }
                );

            },
            error => {

                console.error(
                    "Comment listener error:",
                    error
                );

            }
        );

    </script>

</body>

</html>
