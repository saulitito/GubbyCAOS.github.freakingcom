<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GUBBY FULL CAOS</title>

    <link rel="icon" type="image/png" href="7a35aa1f2cce442ea6fc41a600a21cb9~tplv-jj85edgx6n-image-origin.jpeg">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1 class="title">GUBBY FULL CAOS</h1>

    <button id="gubbyButton">
        RELEASE THE GUBBYS
    </button>

    <!-- SETTINGS BUTTON -->
    <button id="settingsButton">⚙ SETTINGS</button>

    <!-- SETTINGS MENU -->
    <div id="settingsMenu">

        <div class="settingsHeader">
            <span>SETTINGS</span>
            <button id="closeSettings">✕</button>
        </div>

        <div class="setting">
            <span>🔊 Sounds</span>
            <button class="toggle active" id="soundToggle">
                ON
            </button>
        </div>

        <div class="setting">
            <span>🌎 Gravity</span>
            <button class="toggle active" id="gravityToggle">
                ON
            </button>
        </div>

        <div class="setting">
            <span>💥 Wall Bounce</span>
            <button class="toggle active" id="bounceToggle">
                ON
            </button>
        </div>

        <div class="setting">
            <span>👥 Gubbys per click</span>

            <input
                id="gubbyAmount"
                type="number"
                min="1"
                max="100"
                value="15"
            >
        </div>

        <div class="setting">
            <span>⚡ Chaos Mode</span>

            <button class="toggle" id="chaosToggle">
                OFF
            </button>
        </div>

        <button id="clearButton">
            🧹 CLEAR GUBBYS
        </button>

    </div>

    <!-- GUBBYS GO HERE -->
    <div id="gubbyContainer"></div>

    <!-- SOUND -->
    <audio id="gubbySound" src="gubby.mp3"></audio>

    <script src="script.js"></script>

    <div id="musicPlayer">
        <iframe
            id="youtubePlayer"
            width="1"
            height="1"
            src="https://www.youtube.com/embed/b12dBv7EDjU?autoplay=1&loop=1&playlist=b12dBv7EDjU"
            title="Music"
            frameborder="0"
            allow="autoplay; encrypted-media"
            style="position:absolute; opacity:0; pointer-events:none;">
        </iframe>
    </div>

</body>
</html>
