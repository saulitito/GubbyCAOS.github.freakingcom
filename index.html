<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GUBBY FULL CAOS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================
         MAIN GAME
    ========================================== -->

    <div id="gubbyContainer"></div>


    <!-- =========================================
         TOP TITLE
    ========================================== -->

    <h1 class="title">
        GUBBY FULL CAOS
    </h1>


    <!-- =========================================
         SIDE MENU
    ========================================== -->

    <aside id="sideMenu" class="side-menu">

        <div class="menu-header">

            <div>
                <span class="menu-small">
                    GUBBY
                </span>

                <strong>
                    CAOS MENU
                </strong>
            </div>

            <button
                id="closeMenu"
                class="close-menu"
            >
                ✕
            </button>

        </div>


        <div
            id="menuButtons"
            class="menu-buttons"
        >
            <!-- Buttons are generated by script.js -->
        </div>


        <div class="menu-footer">
            GUBBYS:
            <span id="gubbyCounter">0</span>
        </div>

    </aside>


    <!-- =========================================
         MENU OPEN BUTTON
    ========================================== -->

    <button
        id="menuButton"
        class="menu-button"
    >
        ☰
    </button>


    <!-- =========================================
         SETTINGS
    ========================================== -->

    <div
        id="settingsMenu"
        class="settings-menu"
    >

        <div class="settings-header">

            <span>
                GUBBY SETTINGS
            </span>

            <button id="closeSettings">
                ✕
            </button>

        </div>


        <div class="setting">

            <span>
                ✨ Golden Gubbys
            </span>

            <button
                id="goldenToggle"
                class="toggle active"
            >
                ON
            </button>

        </div>


        <div class="setting">

            <span>
                🌈 Rainbow Gubbys
            </span>

            <button
                id="rainbowToggle"
                class="toggle active"
            >
                ON
            </button>

        </div>


        <div class="setting">

            <span>
                💨 Flying Speed
            </span>

            <input
                id="speedAmount"
                type="range"
                min="1"
                max="10"
                value="5"
            >

        </div>


        <div class="setting">

            <span>
                💀 Gubby Amount
            </span>

            <input
                id="gubbyAmount"
                type="number"
                min="1"
                max="100"
                value="25"
            >

        </div>

    </div>


    <!-- =========================================
         MAIN SCRIPT
    ========================================== -->

    <script src="script.js"></script>

</body>

</html>
